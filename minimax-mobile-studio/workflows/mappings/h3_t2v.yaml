workflow: h3_t2v
template: h3_t2v.json
lora_stack:
  model: {node_id: "105:6", output: 0}
  loader_class: LoraLoaderModelOnly
  model_input: model
  name_input: lora_name
  strength_input: strength_model
  model_output: 0
  parameter_inputs: {}
inputs:
  diffusion_model: {node_id: "105:6", input: unet_name}
