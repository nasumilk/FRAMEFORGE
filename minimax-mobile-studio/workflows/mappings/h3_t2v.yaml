    node_id: "105:104"
    input: prompt
    required: true
  seed:
    node_id: "105:15"
    input: noise_seed
  duration:
    node_id: "105:111"
    input: value
  aspect_ratio:
    node_id: "115"
    input: aspect_ratio
  megapixels:
    node_id: "115"
    input: megapixels
  steps:
    node_id: "105:9"
    input: steps
  fps:
    node_id: "105:91"
    input: fps
